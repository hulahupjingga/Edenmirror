name: Manual Optimized Build

on:
  workflow_dispatch:         # manual trigger only

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle   # caches ~/.gradle (wrapper, deps, Kotlin DSL)

      - name: Setup Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-33
            build-tools;33.0.0
            ndk;28.2.13676358
            cmake;3.22.1

      # Install glslangValidator (required for shader compilation)
      - name: Install glslang-tools
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      # Optional: ccache speeds up rebuilds
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-android-optimized
          max-size: 2G   

      - name: Grant execute permission to build script
        run: chmod +x .ci/android/build.sh

      - name: Build optimized Release APK
        env:
          CCACHE: true
        run: |
          ./.ci/android/build.sh \
            --target optimized \
            --build-type Release
          # Add --release to enable update checker, or --nightly for nightly.

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optimized-build
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Show artifact list (debug)
        run: ls -l artifacts/
